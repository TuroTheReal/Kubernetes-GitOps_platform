global:
  edition: ce                          # version gratuite (Community Edition)
  hosts:
    domain: 192.168.57.10.nip.io       # GitLab sera sur gitlab.192.168.57.10.nip.io
    https: false                       # HTTP simple, pas de certificat en local
  ingress:
    class: traefik                     # l'Ingress controller de K3s (comme P2)
    configureCertmanager: false
    tls:
      enabled: false
  kas:
    enabled: false                     # agent Kubernetes de GitLab : inutile ici
  rails:
    bootsnap:
      enabled: false                   # repris de l'exemple officiel
installCertmanager: false              # pas de certificats HTTPS
nginx-ingress:
  enabled: false                       # on a deja Traefik
prometheus:
  install: false                       # monitoring : inutile, gourmand
gitlab-runner:
  install: false                       # CI de GitLab : inutile pour le sujet
registry:
  enabled: false                       # registre d'images Docker : inutile
gitlab:
  webservice:                          # l'interface web : 1 seul pod
    minReplicas: 1
    maxReplicas: 1
  sidekiq:                             # les taches de fond : 1 seul pod
    minReplicas: 1
    maxReplicas: 1
  gitlab-shell:                        # git en SSH : 1 seul pod
    minReplicas: 1
    maxReplicas: 1
  gitlab-exporter:
    enabled: false                     # metriques : inutile