apiVersion: v1                           # version d'API des Services (le coeur de K8s)
kind: Service                            # type d'objet : adresse fixe devant des pods
metadata:
  name: app3                             # nom du Service (= nom DNS interne, l'Ingress le cible)
spec:
  selector:                              # "j'envoie le trafic aux pods qui portent CETTE etiquette"
    app: app3                            # doit etre EXACTEMENT l'etiquette des pods (template.metadata.labels)
  ports:
    - protocol: TCP
      port: 80                           # 1re porte : le port ou le Service ecoute (celui qu'on appelle)
      targetPort: 80                     # 2e porte : le port ou l'app ecoute dans le pod (= containerPort)

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3                             # nom du Deployment
  labels:
    app: app3
spec:
  replicas: 1                            # combien de pods
  selector:
    matchLabels:                         # "les pods que je gère, ce sont ceux qui ont..."
      app: app3
  template:                              # le MOULE pour fabriquer chaque pod
    metadata:
      labels:
        app: app3                        # l'étiquette collée sur chaque pod (= matchLabels)
    spec:
      containers:
      - name: deuxmillequarantehuit                     # nom du conteneur dans le pod
        image: public.ecr.aws/l6m2t8p7/docker-2048:latest    # l'image Docker
        ports:
        - containerPort: 80              # le port où l'app écoute
